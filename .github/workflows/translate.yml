name: Translation sync

on:
  push:
    branches: [master]
    paths: ["**/*.md", "**/*.csv", "**/labels.json", "i18n.json"]
  # drains the backlog: anything the model could not finish (quota, timeout,
  # per-run cap) stays marked stale in translations/.sync-state.json and is
  # picked up here without waiting for the next doc edit
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync all languages
    # the bot's own pushes must not retrigger the loop
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # OLLAMA_API_KEY is an environment secret, so the job must name it
    environment: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      # Without OLLAMA_API_KEY the run reaches no endpoint, saves the state of
      # whatever was already done and exits cleanly — stale files stay stale
      # and the next run picks them up.
      - name: Translate stale files (Ollama Cloud, open-weights LLM)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TRANSLATE_MODEL: glm-5.2
        run: python tools/translate_sync.py --base "${{ github.event.before }}"

      # regenerate figures ONLY when the sync itself translated labels.json:
      # human pushes never trigger a cross-platform re-render (macOS and the
      # runner produce different PNG bytes — that would be endless churn)
      - name: Regenerate figures if the sync updated labels.json
        if: always()
        run: |
          if git status --porcelain | grep -q 'labels\.json'; then
            python software/simulator/channel_sim.py --out docs/img
            python hardware/schematics/render_schematics.py
          fi

      # always(): a run that died halfway still produced valid translations, and
      # the state file records exactly what got done — dropping them would mean
      # paying the model again for the same work
      - name: Commit the result
        if: always()
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/ hardware/schematics/labels.json software/simulator/labels.json translations/.sync-state.json
          git commit -s -m "sync translations and figures [translate-sync]"
          # a second push to master while this job was running left our checkout
          # one commit behind: rebase onto it instead of failing the sync
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the new head"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push origin HEAD:${GITHUB_REF_NAME}

      # the bot pushes with GITHUB_TOKEN, which by design does not trigger CI —
      # so the invariants have to be enforced here or not at all
      - name: Repository invariants
        if: always()
        run: python tools/check_repo.py
