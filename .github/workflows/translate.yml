name: Translation sync

on:
  push:
    branches: [master]
    # tools/** is here because a change to the sync itself changes its output:
    # merging a fix for the translator and having nothing happen, twice in a
    # row, is not a useful default.
    # the workflow file is here for the same reason tools/** is: a change to
    # how the sync runs changes what it produces, and merging such a change to
    # no effect is a trap this repository has already fallen into twice
    paths: ["**/*.md", "**/*.csv", "**/labels.json", "i18n.json", "tools/**",
            ".github/workflows/translate.yml"]
  # drains the backlog: anything the model could not finish (quota, timeout,
  # per-run cap) stays marked stale in translations/.sync-state.json and is
  # picked up here without waiting for the next doc edit
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync all languages
    # the bot's own pushes must not retrigger the loop
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # OLLAMA_API_KEY is an environment secret, so the job must name it
    environment: "translation-sync"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      # this job re-renders the figures, so it needs the same non-Latin
      # coverage as ci.yml — see the note there
      - name: Fonts for non-Latin figures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk

      # Without OLLAMA_API_KEY the run reaches no endpoint, saves the state of
      # whatever was already done and exits cleanly — stale files stay stale
      # and the next run picks them up.
      - name: Translate stale files (Ollama Cloud, open-weights LLM)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TRANSLATE_MODEL: glm-5.2
        run: |
          python tools/translate_sync.py --base "${{ github.event.before }}" \
            --touched-list "$RUNNER_TEMP/touched.txt"

      # Always render. The old gate ran the renderers only when this sync had
      # just changed labels.json, which meant a language whose labels landed in
      # an earlier run never got figures at all — eight of them had none. The
      # gate existed to stop macOS-rendered bytes fighting runner-rendered
      # bytes, but this job only ever runs on the runner with a pinned
      # toolchain, so re-rendering unchanged labels reproduces the same bytes
      # and stages nothing. That last clause held for PNG and was false for SVG:
      # matplotlib stamps a wall-clock date and per-process clip-path ids into
      # every SVG, so this step recommitted all 56 schematics every night with no
      # content change until render_schematics.py pinned both.
      - name: Render figures
        if: always()
        run: |
          python software/simulator/channel_sim.py --out docs/img
          python hardware/schematics/render_schematics.py

      # always(): a run that died halfway still produced valid translations, and
      # the state file records exactly what got done — dropping them would mean
      # paying the model again for the same work
      # Before the commit, deliberately. The bot pushes with GITHUB_TOKEN, which
      # by design triggers no CI, so this is the only gate master ever gets —
      # and it used to run last, which made it a post-mortem rather than a gate:
      # run 33307609143 translated thirteen dead anchors, pushed them to master
      # and only then went red. continue-on-error keeps the result available to
      # the commit step instead of ending the job here, because the work is paid
      # for and must be preserved either way.
      - name: Repository invariants
        id: invariants
        if: always()
        continue-on-error: true
        run: python tools/check_repo.py

      - name: Commit the result
        if: always()
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to sync"
            # A clean tree that fails the invariants means the breakage is
            # already committed on the branch and no sync will heal it. Staying
            # green here would hide it until the next unrelated change.
            if [ "${{ steps.invariants.outcome }}" != "success" ]; then
              echo "::error::Nothing to sync, but check_repo failed on the tree as"\
                   "checked out: ${GITHUB_REF_NAME} is broken independently of this run."
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage exactly what the sync reported writing. The previous
          # hand-written pathspec listed translations/ and the labels files and
          # so silently dropped every primary-tree edit: the language bars the
          # deterministic pass rewrites in README.md and the other canonical
          # docs were generated here, never staged, and discarded with the
          # workspace — mirrors listed fifteen languages while English listed
          # six. The list keeps the blast radius bounded without guessing.
          if [ -s "$RUNNER_TEMP/touched.txt" ]; then
            git add --pathspec-from-file="$RUNNER_TEMP/touched.txt"
          fi
          # Figures come from the renderers, which are separate processes and so
          # are not in touched.txt. Iterate real directories rather than passing
          # a wildcard pathspec: `git add 'translations/*/docs/img'` is a fatal
          # "did not match any files" — a glob pathspec matches whole paths, not
          # directory prefixes — and because that fatal aborted the whole
          # command, no figure was ever staged, not even docs/img. The 2>/dev/null
          # is gone too; that is what kept it invisible.
          for d in docs/img hardware/schematics \
                   translations/*/docs/img translations/*/hardware/schematics; do
            if [ -d "$d" ]; then git add -- "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing staged — working tree changes were all outside the sync's scope"
            if [ "${{ steps.invariants.outcome }}" != "success" ]; then
              echo "::error::Nothing staged, but check_repo failed:"\
                   "${GITHUB_REF_NAME} is broken independently of this run."
              exit 1
            fi
            exit 0
          fi
          git commit -s -m "sync translations and figures [translate-sync]"
          # The gate. An invalid tree is still committed — the model was paid for
          # this work and throwing it away means paying again — but it goes to a
          # branch a human can inspect, rebase or cherry-pick, never to
          # ${GITHUB_REF_NAME}. The run id keeps the name unique, so no rescue
          # branch ever overwrites another.
          if [ "${{ steps.invariants.outcome }}" != "success" ]; then
            rescue="sync-rescue/${{ github.run_id }}"
            git push origin "HEAD:refs/heads/$rescue"
            echo "::error::check_repo failed on this tree, so it was NOT pushed to"\
                 "${GITHUB_REF_NAME}. The work is preserved on branch $rescue —"\
                 "fix the invariants there and merge it, or drop the branch and let"\
                 "the next sync redo the pairs (the state file rides along with it)."
            exit 1
          fi
          # a second push to master while this job was running left our checkout
          # one commit behind: rebase onto it instead of failing the sync
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the new head"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push origin HEAD:${GITHUB_REF_NAME}

