name: DCO

on: pull_request

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off on every commit (CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha lacks Signed-off-by — use git commit -s (see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
