name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Scripts and generated assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      # The runner ships DejaVu only, which has no Han, kana or Hangul: the
      # figures for zh/ja/ko render as .notdef boxes and nothing downstream
      # looks at pixels. The renderers now refuse to draw a glyph they cannot
      # cover, so without these packages they fail instead of committing tofu.
      - name: Fonts for non-Latin figures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk

      - name: Compile all scripts
        run: python -m compileall -q software hardware tools

      # links, labels.json placeholders and mirror completeness — the classes of
      # breakage the translation bot can introduce and that nothing else catches
      - name: Repository invariants
        run: python tools/check_repo.py

      - name: Mock-mode sweep (full CSV + plot pipeline)
        run: python software/sweep-map/sweep_map.py --mock --out /tmp/ci-sweep

      - name: Expectation charts (channel simulator)
        run: python software/simulator/channel_sim.py --out /tmp/ci-img

      - name: Schematics
        run: python hardware/schematics/render_schematics.py

      # A byte that differs between two identical renders is a byte the nightly
      # translation sync commits forever: matplotlib stamped a wall-clock date
      # and per-process clip-path ids into every SVG, and that job dutifully
      # recommitted all 56 schematics every night with no content change.
      # render_schematics.py pins both — this is what keeps them pinned.
      - name: Schematics render reproducibly
        run: |
          find hardware/schematics translations -path '*schematics*' \
               \( -name '*.svg' -o -name '*.png' \) | sort \
            | xargs sha256sum > "$RUNNER_TEMP/figures.sha256"
          python hardware/schematics/render_schematics.py
          sha256sum -c --quiet "$RUNNER_TEMP/figures.sha256"

      - name: Artifacts (all generated figures)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-figures
          path: |
            /tmp/ci-sweep/*.png
            /tmp/ci-img/*.png
            hardware/schematics/*.png
            translations/*/docs/img/*.png
            translations/*/hardware/schematics/*.png
          retention-days: 14
