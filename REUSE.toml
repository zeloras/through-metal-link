version = 1
SPDX-PackageName = "through-metal-link"

[[annotations]]
path = ["software/**", "firmware/**", "tools/**"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["hardware/**"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = ["docs/**", "experiments/**", "data/**", "*.md", "NOTICE", "LICENSE", "CITATION.cff", ".gitignore", "REUSE.toml", ".github/**", "i18n.json", "translations/**"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# A translation is a derivative of the document it mirrors, so it has to carry
# that document's license — not the license of the translations/ tree it happens
# to live in. One block per source license.
[[annotations]]
path = ["translations/*/hardware/**"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

[[annotations]]
path = ["translations/*/software/**", "translations/*/firmware/**"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "Apache-2.0"

# bookkeeping for tools/translate_sync.py, not documentation
[[annotations]]
path = ["translations/.sync-state.json"]
SPDX-FileCopyrightText = "2026 Vitalii Gerasimov and through-metal-link contributors"
SPDX-License-Identifier = "Apache-2.0"
